<style>html,body{height:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Feuille de Perso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout : une colonne mobile sur parchemin, en-tête collant (nom, états, onglets), titres en petites capitales rouges soulignés d'un filet effilé comme dans les blocs de stats */
/* Thème unique, assumé : parchemin clair (lisible en jeu, même dans un téléphone en mode sombre) */
:root{
  --bg:#efe2c2;--card:#f6ecd4;--fg:#2a1c12;--muted:#6e5a44;--line:#cdb68c;
  --accent:#7a1c12;--accent-soft:#ecd3b8;--on-accent:#fbf4e4;--danger:#7a1c12;--danger-soft:#ecd3b8;
  --conc:#3f5226;--conc-soft:#dfe3c4;--warn:#6a4a10;--warn-soft:#f1dfae;
  --disp:"IM Fell English SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html{background:var(--bg)}
body{color:var(--fg);font:17px/1.4 var(--body);background:var(--bg)}
*{box-sizing:border-box}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
main{display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;color:var(--accent)}
h1{font-size:1.6rem;line-height:1.1}
/* filet rouge plein sous chaque titre */
h2{font-size:1.25rem;letter-spacing:.02em;padding-bottom:4px;border:none;
   border-bottom:2px solid var(--accent)}
/* titre avec un bouton à droite (Repos long) */
.h2b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h2b button{font-family:var(--body);font-size:.95rem;letter-spacing:0;height:30px;padding:0 10px;display:inline-flex;align-items:center;line-height:1;margin-bottom:4px}
.err-t{color:var(--danger)}
/* pas de filet sous le dernier élément d'une liste */
ul.plain li:last-child,.res>:nth-last-child(-n+2),.skill:nth-last-child(-n+2),
.arme:not(:has(~ .arme)),.arme-ed:not(:has(~ .arme-ed)),.slot:not(:has(~ .slot)),.sort:not(:has(~ .sort)),
.sort-ed:not(:has(~ .sort-ed)),.objet:not(:has(~ .objet)),.obj-ed:not(:has(~ .obj-ed)){border-bottom:none}
section{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:.92rem;font-style:italic}
button{font:inherit;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:4px;padding:8px 12px;cursor:pointer}
button.pri,button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.dgr{color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
a{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 3px rgba(80,50,20,.12)}
.texte{white-space:pre-wrap;overflow-wrap:anywhere}
.lab{font-family:var(--disp);font-size:.85rem;letter-spacing:.04em;color:var(--muted)}
/* en-tête */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));margin-top:-12px;padding-top:16px!important;display:flex;flex-direction:column;gap:6px;padding-top:4px;padding-bottom:0}
.top>.row{flex-wrap:nowrap}
.top .titre{flex:1;min-width:0}
.top .titre h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .titre .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{padding:5px 9px;font-size:.92rem}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--accent)}
.tabs button{flex:1;padding:6px 2px 4px;font-family:var(--disp);font-size:1rem;border:none;border-radius:3px 3px 0 0;white-space:nowrap;min-width:0;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
/* boutons de l'en-tête (‹, États, crayon) : hauteur fixe identique ; le crayon est un carré de cette hauteur */
.top>.row>button{height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
.top>.row>button.icone{width:36px;padding:0}
.top button.icone svg{display:block;width:18px;height:18px}
/* mode Modifier : champs et boutons d'une même hauteur, pour des lignes alignées */
main.ed input{box-sizing:border-box;height:32px;padding:0 8px;font-size:.95rem}
main.ed .lien-in,main.ed .lien-ed input{font-size:.8rem}
main.ed button{box-sizing:border-box;height:32px;padding:0 10px;font-size:.95rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
main.ed .x{width:32px;padding:0}
main.ed .box{height:18px;padding:0}
main.ed .pvval input{height:auto;padding:0;font-size:2.1rem}
main.ed .pvcard .pv button{height:34px;padding:0;font-size:1.2rem}
main.ed .cpt button{width:34px;height:34px;padding:0;font-size:1.2rem}
/* états actifs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:.92rem;padding:2px 10px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.chip.conc{border-color:var(--conc);background:var(--conc);color:var(--on-accent)}
.etats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.etats button{padding:7px 6px;font-size:1rem}
.etats button.on{background:var(--accent);color:var(--on-accent)}
/* PV */
.pv{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.pv button{font-size:1.6rem;padding:4px 0;line-height:1.2}
.pvval{display:flex;align-items:baseline;justify-content:center;gap:6px;font-variant-numeric:tabular-nums lining-nums}
.pvval input{width:4.5ch;font-size:2.4rem;font-weight:700;text-align:center;padding:0;border:none;background:transparent;border-bottom:1px solid var(--accent);border-radius:0;color:var(--accent)}
.pvval span{font-size:1.3rem;color:var(--muted)}
.pvcard{display:grid;grid-template-columns:1.35fr 1fr;gap:10px 14px;padding:10px 12px}
.pvcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.pvcol+.pvcol{border-left:1px solid var(--line);padding-left:12px}
.pvcard .pv{grid-template-columns:30px 1fr 30px;gap:4px}
.pvcard .pv button{font-size:1.2rem;padding:0;height:34px}
.pvcard .pvval input{width:3ch;font-size:2.1rem}
.pvcard .pvval span{font-size:1.15rem}
.pvcol .pv{margin-top:auto}
.mort{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.mort-g{display:grid;grid-template-columns:auto auto;gap:2px 10px;align-items:center;justify-items:end}
.mort .boxes{gap:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;padding:6px 2px;min-width:0}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.stat .lab{font-size:.72rem;letter-spacing:.01em}
/* cases : losanges, comme les emplacements des fiches officielles */
.boxes{display:grid;gap:4px 8px;justify-content:end;padding:2px}
.slot .boxes{justify-content:end}
.cpt{display:flex;align-items:center;gap:10px;justify-content:end}
.cpt button{width:34px;height:34px;padding:0;font-size:1.2rem;line-height:1}
.cpt b{font-size:1.3rem;min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums lining-nums}
.cpt b span{font-size:.95rem;font-weight:400;color:var(--muted)}
.box{width:18px;height:18px;padding:0;border:2px solid var(--accent);border-radius:2px;background:transparent;transform:rotate(45deg);margin:3px}
.box.on{background:var(--accent)}
.box.e{border-color:var(--fg)}.box.e.on{background:var(--fg)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.res .n{min-width:0}
/* filet fin entre les ressources, comme pour l'équipement */
.res{gap:0}.res>.n{padding-right:10px}
.res>*{align-self:stretch;border-bottom:1px solid var(--line);padding:5px 0;min-height:40px;box-sizing:border-box}
.res>.n{display:flex;align-items:center}.res>.boxes{align-content:center}.res>.cpt,.res>.res-ed{align-items:center}
.x{border:none;background:transparent;color:var(--accent);padding:4px 8px}
/* armes */
.armes{display:flex;flex-direction:column}
.arme{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.arme .nom{font-weight:700;font-size:1.08rem}
.arme .att{font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums lining-nums;color:var(--accent);text-align:right}
.arme .deg{grid-column:1/-1}
.arme-ed{display:grid;grid-template-columns:1fr 4.2rem auto;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.arme-ed .full{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.arme-ed input{padding:4px 6px}
/* caracs */
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.car{text-align:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;padding:6px}
.car .lab{color:var(--accent)}
.car .m{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums lining-nums;line-height:1.1}
.car .v{color:var(--muted);font-size:.9rem}
.car .s{font-size:.85rem;margin-top:2px}
.dot{display:inline-block;width:.55em;height:.55em;border:1.5px solid var(--accent);margin-right:7px;vertical-align:.08em;transform:rotate(45deg)}
.dot.on{background:var(--accent)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.skill{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);font-size:1rem;min-width:0}
.skill b{font-variant-numeric:tabular-nums lining-nums}
/* toutes les listes suivent la convention de l'équipement : une ligne par élément, filet fin dessous */
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.plain li{padding:5px 0;border-bottom:1px solid var(--line);min-height:40px;display:flex;align-items:center}
/* sorts */
.magie{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{display:grid;grid-template-columns:5rem 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);min-height:40px;box-sizing:border-box}
.sort{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-bottom:1px solid var(--line)}
.sort a{font-weight:700;font-size:1.08rem;text-decoration:none;color:var(--fg)}  /* noir gras, comme les armes ; le rouge reste aux titres */
.sort>div:first-child{display:flex;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:17px;min-width:17px;font-family:var(--disp);font-size:.72rem;line-height:1;border:1px solid var(--accent);border-radius:2px;padding:2px 3px 0;margin-left:6px;color:var(--accent)}
.grid9{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid9 label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coins label,.coin{font-family:var(--disp);font-size:.85rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.coin b{font-family:var(--body);font-size:1.3rem;color:var(--fg);font-variant-numeric:tabular-nums lining-nums}
.coins input{text-align:center;font-variant-numeric:tabular-nums}
/* équipement */
.objets{display:flex;flex-direction:column}
.objet{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);min-height:40px}
.qte{display:flex;align-items:center;gap:6px;flex:none}
.qte button{padding:0;width:30px;height:30px;line-height:1;font-size:1.1rem}
.qte b{min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums lining-nums}
.obj-ed{display:grid;grid-template-columns:3.4rem 1fr auto;gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.obj-ed input{padding:4px 6px}
.obj-ed .lien-in{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.sort-ed{padding:6px 0 8px;border-bottom:1px dashed var(--line)}
.sort-ed .row{flex-wrap:nowrap}
.sort-ed .nom{flex:1;font-weight:700}
.sort-ed .sort-inf{flex-wrap:nowrap;margin-top:4px}
.sort-ed .sort-inf input{flex:1;min-width:0;padding:4px 6px}
.sort-ed .lien-in{width:100%;margin-top:4px;padding:4px 6px;font-size:.8rem;color:var(--muted)}
.res-ed{flex-wrap:nowrap;justify-content:end}.res-ed input{width:4.5rem;text-align:center}
.capa-ed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}.capa-ed .lien-ed{min-width:0}
.grat{display:inline-flex;align-items:center;gap:6px;margin-left:10px;vertical-align:middle}.grat .muted{font-size:.8rem}.grat .boxes{gap:2px 4px;padding:0}.grat .box{width:10px;height:10px;margin:2px;border-width:1.5px}
.grat .box{position:relative}.grat .box::after{content:'';position:absolute;inset:-9px}  /* zone de toucher plus grande que le losange */
.lien-ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px;align-items:center;font-size:1rem}
.lien-ed input{font-size:.8rem;padding:4px 6px}
/* liens vers AideDD sans indicateur : on touche le nom pour lire la règle (les liens restent visibles en mode Modifier) */
a.ext{text-decoration:none;color:inherit}
.alerte{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--conc-soft);color:var(--conc);border:1px solid var(--conc);border-radius:3px;padding:6px 10px}
.alerte b{font-family:var(--disp);font-weight:400;font-size:1.1rem}
.alerte button{flex:none;border-color:var(--conc);color:var(--conc)}
.perso{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:12px;color:var(--fg);border-color:var(--line)}
.perso .t{font-family:var(--disp);font-size:1.3rem;color:var(--accent)}
.msg{background:var(--card);border-left:3px solid var(--conc);border-radius:2px;padding:8px 10px;font-size:.95rem}
.msg.err{border-left-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .box{transition:background .12s}
  main.in-g{animation:inG .18s ease-out}main.in-d{animation:inD .18s ease-out}
  @keyframes inG{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
  @keyframes inD{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
}
/* les 5 tuiles restent sur une ligne, même sur petit écran */
@media (max-width:420px){.stats{gap:4px}.stat{padding:5px 1px}.stat b{font-size:1.2rem}.stat .lab{display:block;font-size:.66rem;line-height:1.1}}
</style>
</head>

function lireObjet(x){
  let nom=String(x).trim(),qte=1,compte=false,m;
  if((m=nom.match(/^(\d+)\s+(.+)$/))){qte=+m[1];nom=m[2];compte=true}
  else if((m=nom.match(/^(.+?)\s*\((\d+)(?:\s[^)]*)?\)$/))){nom=m[1];qte=+m[2];compte=true}
  nom=nom.trim();return{nom:nom.charAt(0).toUpperCase()+nom.slice(1),qte,compte};
}

function mettreAJour(p,d){

  d.armes.forEach(a=>{if(!noms.has(a.nom))e.armes.push({...a})});

function differences(p,d){

  const nn=vrai(d.id.nom),noms=[vrai(old.id.nom),vrai(p.etat.nom)].filter(Boolean).map(x=>x.toLowerCase());

  if(d.id.classe!==old.id.classe)r.push('classe '+d.id.classe+' au lieu de '+old.id.classe);
  if(num(d.id.niveau)<num(old.id.niveau))r.push('niveau '+d.id.niveau+', plus bas que '+old.id.niveau);
  return r;
}

  const cur=D(p);p.versions.pop();const old=D(p);
  if(num(p.etat.pv)>num(old.combat.pvMax))p.etat.pv=num(old.combat.pvMax);

}

/* capacités AideDD qui ne sont jamais des ressources (évite les doublons) */
const PAS_RESSOURCE=new Set(['sorts']);
function contexte(d){
  const mod={};d.car.forEach(c=>mod[c.n]=num(c.mod));
  return{niv:Math.max(1,num(d.id.niveau)),pb:Math.max(2,num(d.combat.maitrise)),mod};

/* nombre d'utilisations écrit par AideDD, ou null s'il n'y en a pas de sûr */
function usagesTexte(nom){
  const t=String(nom).match(/\((.*)\)/);if(!t)return null;
  let m;
  for(const seg of t[1].split(/[;,]/)){
    if(/\/\s*Repos/i.test(seg)){
      const s=seg.replace(/\d*d\d+/gi,' ').replace(/\d+\s*\+/g,' ').replace(/\+\s*\d+/g,' ');
      const n=s.split(/\/\s*Repos/i)[0].match(/(\d+)\s*$/)||s.split(/\/\s*Repos/i)[0].match(/(\d+)/);
      if(n&&+n[1]>0)return{max:+n[1]};
    }
    if((m=seg.match(/^\s*(\d+)\s+(?:[A-Za-zÀ-ÿ]+\s+)?pts\s*$/i))&&+m[1]>=2)return{max:+m[1]};
  }
  if((m=t[1].match(/^\s*(\d+)\s*pv\s*$/i)))return{max:+m[1],pv:1};
  return null;
}
function ressourcesBrutes(d){
  const c=contexte(d),r=[],vus=new Set();
  const ajoute=(o)=>{const ks=[o.nom,...(o.a||[])].map(norm);if(ks.some(k=>vus.has(k))||!(o.max>0))return;ks.forEach(k=>vus.add(k));r.push(o)};
  ajoute({k:'r:inspiration-heroique',nom:'Inspiration héroïque',max:1});
  (RES_CLASSE[d.id.classe]||[]).forEach(x=>ajoute({k:'r:'+norm(x.n),nom:x.n,a:x.a,max:x.m(c),pv:x.pv,lien:['capa',x.n]}));
  (RES_SOUSCLASSE[d.id.sousClasse]||[]).forEach(x=>ajoute({k:'r:'+norm(x.n),nom:x.n,a:x.a,max:x.m(c),lien:['capa',x.n]}));
  d.traits.forEach(t=>{const n=propre(sansCoche(t)),f=RES_TRAIT[n];if(f)ajoute({k:'r:'+norm(n),nom:n,max:f(c),lien:['trait',n]})});
  d.dons.forEach(t=>{const n=propre(t),f=RES_DON[n];if(f)ajoute({k:'r:'+norm(f.n),nom:f.n,max:f.m(c),lien:['don',n]})});
  d.capa.forEach(x=>{const n=propre(sansCoche(x.nom));if(PAS_RESSOURCE.has(norm(n)))return;const u=usagesTexte(x.nom);
    if(u)ajoute({k:'r:'+norm(n),nom:n,max:u.max,pv:u.pv,lien:['capa',x.nom]})});
  return{r,vus};
}
function ressources(p){
  const d=D(p),e=p.etat,ov=e.resOv||{},{r}=ressourcesBrutes(d),out=[];
  r.forEach(x=>{const o=ov[x.k]||{};if(o.off)return;if(o.max!=null&&o.max!=='')x.max=num(o.max);if(x.max>0)out.push(x)});
  out.push({k:'dv',nom:'Dés de vie ('+d.combat.dv+')',max:Math.max(1,num(d.id.niveau))});
  e.ressPerso.forEach((x,i)=>out.push({k:'p:'+x.nom,nom:x.nom,max:x.max,perso:i}));
  return out;
}
function ressourcesMasquees(p){const ov=p.etat.resOv||{};return ressourcesBrutes(D(p)).r.filter(x=>(ov[x.k]||{}).off)}
/* capacités déjà affichées comme ressources : on ne les répète pas dans la liste des capacités */
function capaEstRessource(d,nom){const{vus}=ressourcesBrutes(d);return vus.has(norm(propre(sansCoche(nom))))||PAS_RESSOURCE.has(norm(propre(nom)))}

/* ---------- sorts gratuits (1 fois par repos long sans emplacement, ou bonus de maîtrise) ---------- */
const LIGNAGES={
  'Elfe':[{c:'Prestidigitation',s:['Détection de la magie','Foulée brumeuse']},{c:'Druidisme',s:['Grande foulée','Passage sans trace']},{c:'Lumières dansantes',s:['Lueurs féeriques','Ténèbres']}],
  'Tieffelin':[{c:'Bouffée de poison',s:['Rayon empoisonné','Immobilisation de personne']},{c:'Contact glacial',s:['Simulacre de vie','Rayon affaiblissant']},{c:'Trait de feu',s:['Représailles infernales','Ténèbres']}],
  'Gnome':[{c:'Illusion mineure',s:['Communication avec les animaux'],pb:1}]
};
function sortsGratuits(d){
  const c=contexte(d),g={},ajoute=(nom,n)=>{if(nom&&!/^S\d+$/.test(nom)){const k=norm(nom);g[k]=(g[k]||0)+n}};
  const noms=new Set(d.sorts.map(s=>norm(s.nom)));
  const dons=String(d.choix&&d.choix.feats||'').split(','),o3=String(d.choix&&d.choix.option3||'').split(',');
  dons.forEach((f,i)=>{f=f.trim();const choisi=(o3[i]||'').trim();
    if(f==='Initié à la magie')ajoute(choisi,1);
    if(f==='Affinité féerique'){ajoute('Foulée brumeuse',1);ajoute(choisi,1)}
    if(f==='Affinité ombreuse'){ajoute('Invisibilité',1);ajoute(choisi,1)}
    if(f==='Télépathe')ajoute('Détection des pensées',1)});
  (LIGNAGES[d.id.espece]||[]).forEach(l=>{if(noms.has(norm(l.c))&&l.s.some(s=>noms.has(norm(s))))l.s.forEach(s=>ajoute(s,l.pb?c.pb:1))});
  if(d.id.classe==='Paladin'){if(c.niv>=2)ajoute('Châtiment divin',1);if(c.niv>=5)ajoute('Appel de destrier',1)}
  return g;
}
/* emplacements de pacte de l'Occultiste, écrits en texte par AideDD : « 2 spell slots of level 3 » */
function pacte(d){for(const x of d.capa){const m=String(x.nom).match(/(\d+)\s+spell slots?\s+of\s+level\s+(\d)/i);if(m)return{n:+m[1],niv:+m[2]}}return null}
function cases(k,max,cls='',compteur=false){
  const u=Math.min(P().etat.used[k]||0,max);let h='';
  /* au-delà de 12 (réserves de points) ou réserve de PV : compteur « restants / max » au lieu des cases */
  if(max>12||compteur)return `<div class="cpt"><button data-a="cpt" data-k="${esc(k)}" data-d="1" data-max="${max}" aria-label="Dépenser 1">−</button><b>${max-u}<span> / ${max}</span></b><button data-a="cpt" data-k="${esc(k)}" data-d="-1" data-max="${max}" aria-label="Récupérer 1">+</button></div>`;
  const ligne0=max<=6?max:Math.ceil(max/2);
  for(let i=0;i<max;i++)h+=(i===ligne0&&max%2&&max>6?'<span aria-hidden="true"></span>':'')+`<button class="box ${cls} ${i<u?'on':''}" data-a="case" data-k="${esc(k)}" data-i="${i}" data-max="${max}" aria-label="case ${i+1} sur ${max}"></button>`;
  /* jusqu'à 6 cases : une ligne ; de 7 à 12 : deux lignes équilibrées (10 → 5 + 5), centrées sur le nom */
  const ligne=max<=6?max:Math.ceil(max/2);
  return `<div class="boxes" style="grid-template-columns:repeat(${ligne},auto)">${h}</div>`;
}
/* ---------- liens AideDD (automatiques, remplaçables en mode Modifier) ---------- */
const AD='https://www.aidedd.org/';
const propre=s=>String(s||'').replace(/\(.*?\)/g,'').replace(/✔/g,'').trim();
const slug=s=>propre(s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
/* le texte recherché s'arrête avant le premier mot à apostrophe (' ou ’ selon les pages) : « Bottes d'armes » cherche « Bottes » */
const frag=s=>{const m=propre(s).split(/\s+/),k=m.findIndex(w=>/['’]/.test(w));return encodeURIComponent((k>0?m.slice(0,k):m).join(' ')).replace(/-/g,'%2D')};
const ARMURE=/armure|cotte|harnois|cuirasse|clibanion|demi-plate|brigandine|bouclier|broigne|chemise de mailles/i;
function lienAuto(type,nom,d,extra){
  switch(type){
    case 'objet':{
      if(ARMURE.test(nom))return AD+'regles-24/equipement/armures/#:~:text='+frag(nom);
      if(/^(matériel|outils|instruments?|nécessaire|kit|accessoires|ustensiles|jeu) /i.test(propre(nom)))return AD+'regles-24/equipement/outils/#:~:text='+frag(nom);
      const ar=(d.armes||[]).find(a=>a.nom.toLowerCase()===propre(nom).toLowerCase());
      if(ar)return lienAuto('arme',ar.nom,d,ar.deg);
      return AD+'regles-24/equipement/materiel-daventurier/#:~:text='+frag(nom);
    }
    case 'don':return AD+'feat/fr/'+slug(nom);
    case 'trait':return AD+'regles-24/origines-des-personnages/description-des-especes/#:~:text='+frag(nom);
    case 'espece':return AD+'regles-24/origines-des-personnages/description-des-especes/#:~:text='+frag(nom);
    case 'historique':return AD+'regles-24/origines-des-personnages/description-des-historiques/#:~:text='+frag(nom);
    case 'capa':{
      const st=String(nom).match(/^\s*Style de combat\s*\((.+)\)/i);
      if(st)return AD+'feat/fr/'+slug(st[1]);   /* en 2024, chaque style de combat est un don */
      return AD+'regles-24/classes/'+slug(d.id.classe)+'/#:~:text=%3A-,'+frag(nom);
    }
    case 'arme':{
      /* on cible la ligne du tableau : nom suivi du dé de dégâts (ex. « Épée courte » puis « 1d6 ») */
      const de=String(extra||'').match(/\d+d\d+/);
      return AD+'regles-24/equipement/armes/#:~:text='+frag(nom)+(de?',-'+de[0]:'');
    }
    case 'etat':return AD+'regles-24/glossaire/etats/#'+slug(nom);
    case 'sort':return extra||AD+'spell/fr/'+slug(String(nom).replace(/\|/g,' '));
  }
  return '';
}
function lien(type,nom,extra){const p=P();return (p.etat.liens||{})[type+':'+propre(nom)]||lienAuto(type,nom,D(p),extra)}
/* AideDD coche (✔) les aptitudes prises en compte dans ses calculs : inutile ici */
const sansCoche=t=>String(t??'').replace(/\s*[✔✓]\s*/g,' ').trim();

function xesc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function ongCombat(p,d,e){

  const stats=[['CA',c.ca],['Init.',c.init],['Vitesse',c.vitesse],['Maîtrise',c.maitrise],['Perc. passive',c.percPassive]]
    .map(([l,v])=>`<div class="stat"><b>${esc(v)}</b><span class="lab">${l}</span></div>`).join('');
  const armes=ed?e.armes.map((a,i)=>`<div class="arme-ed">
      <input data-f="armes.${i}.nom" value="${esc(a.nom)}" placeholder="Nom" aria-label="Nom de l'arme">
      <input data-f="armes.${i}.att" value="${esc(a.att)}" placeholder="+0" aria-label="Bonus d'attaque">
      <button class="x" data-a="supprArme" data-i="${i}" aria-label="Retirer l'arme">✕</button>
      <div class="full"><input data-f="armes.${i}.deg" value="${esc(a.deg)}" aria-label="Dégâts" placeholder="Dégâts"><input data-f="armes.${i}.note" value="${esc(a.note)}" aria-label="Notes" placeholder="Botte / notes"></div></div>`).join('')+`<button data-a="ajoutArme">+ Ajouter une arme</button>`
    :(e.armes.length?`<div class="armes">${e.armes.map(a=>`<div class="arme"><span class="nom">${a.nom?itemLien('arme',a.nom,undefined,a.deg):'Sans nom'}</span><span class="att">${esc(a.att)}</span>
      <span class="deg">${esc(a.deg)}${botteHtml(a)}</span></div>`).join('')}</div>`:'<p class="muted">Aucune arme. Ajoute-en avec Modifier.</p>');
  const lienRes=r=>r.lien?itemLien(r.lien[0],r.lien[1],r.nom):esc(sansCoche(r.nom));
  const res=ed
    ?ressources(p).map(r=>r.k==='dv'?'':`<div class="n">${esc(sansCoche(r.nom))}</div><div class="row res-ed">${r.perso!=null
        ?`<span class="muted">${r.max}</span><button class="x" data-a="supprRes" data-i="${r.perso}" aria-label="Retirer ${esc(r.nom)}">✕</button>`
        :`<input data-ovr="${esc(r.k)}" inputmode="numeric" value="${r.max}" aria-label="Maximum pour ${esc(r.nom)}"><button class="x" data-a="resOff" data-k="${esc(r.k)}" aria-label="Masquer ${esc(r.nom)}">✕</button>`}</div>`).join('')
    :ressources(p).map(r=>`<div class="n">${lienRes(r)}</div>${cases(r.k,r.max,'',!!r.pv)}`).join('');
  const masquees=ed?ressourcesMasquees(p).map(r=>`<button data-a="resOn" data-k="${esc(r.k)}">+ ${esc(r.nom)}</button>`).join(''):'';
  const perso=new Set(e.ressPerso.map(x=>norm(x.nom)));
  const capas=d.capa.filter(x=>!capaEstRessource(d,x.nom)&&!perso.has(norm(propre(sansCoche(x.nom)))));
  const nomCapa=x=>x.nom+(x.max?' ('+x.max+')':'');
  const autres=ed?capas.map(x=>`<div class="capa-ed">${itemLien('capa',x.nom,nomCapa(x))}<button data-a="capaRes" data-n="${esc(nomCapa(x))}" title="Afficher en cases">Cases</button></div>`).join('')
    :capas.map(x=>`<li>${itemLien('capa',x.nom,nomCapa(x))}</li>`).join('');
  return `<section class="card pvcard">
      <div class="pvcol"><div class="lab">Points de vie</div>
        <div class="pv"><button data-a="pv" data-c="pv" data-d="-1" aria-label="Retirer 1 PV">−</button>
        <div class="pvval"><input id="pv" data-f="pv" data-num inputmode="numeric" value="${esc(e.pv)}" aria-label="PV actuels"><span>/ ${esc(c.pvMax)}</span></div>
        <button data-a="pv" data-c="pv" data-d="1" aria-label="Ajouter 1 PV">+</button></div></div>
      <div class="pvcol"><div class="lab">PV temporaires</div>
        <div class="pv temp"><button data-a="pv" data-c="pvTemp" data-d="-1" aria-label="Retirer 1 PV temporaire">−</button>
        <div class="pvval"><input id="pvt" data-f="pvTemp" data-num inputmode="numeric" value="${esc(e.pvTemp)}" aria-label="PV temporaires"></div>
        <button data-a="pv" data-c="pvTemp" data-d="1" aria-label="Ajouter 1 PV temporaire">+</button></div></div>
      <div class="mort"><span class="lab">Jets contre<br>la mort</span><div class="mort-g"><span class="lab">Succès</span>${cases('jm:s',3)}<span class="lab">Échecs</span>${cases('jm:e',3,'e')}</div></div></section>
    <div class="stats">${stats}</div>
    <section><h2>Armes et attaques</h2>${armes}</section>
    <section><h2>Ressources</h2>${ed?'<div class="lab">Maximum de chaque ressource (modifiable)</div>':''}<div class="res">${res}</div>
      ${masquees?`<div class="lab">Ressources masquées</div><div class="row">${masquees}</div>`:''}
      ${ed?`<div class="row"><input id="rnom" placeholder="Nouvelle ressource" style="flex:1"><input id="rmax" inputmode="numeric" placeholder="Max" style="width:4.5rem"><button data-a="ajoutRes">Ajouter</button></div>`:''}</section>
    ${autres?`<section><h2>Capacités</h2>${ed?`<div class="lab">Liens vers AideDD (modifiables) · « Cases » la transforme en ressource</div>${autres}`:`<ul class="plain">${autres}</ul>`}</section>`:''}`;
}

  const m=d.maitrises,arm=[['L','légères'],['I','intermédiaires'],['Lo','lourdes'],['B','boucliers']].filter(([k])=>m.armures[k]).map(x=>x[1]).join(', ');

    <section><h2>Dons</h2>${ui.edit?d.dons.map(t=>itemLien('don',t)).join(''):`<ul class="plain">${d.dons.map(t=>`<li>${itemLien('don',t)}</li>`).join('')}</ul>`}</section>

function ongSorts(p,d,e){
  const mg=d.magie,v=k=>e.magie[k]!=null?e.magie[k]:mg[k],ed=ui.edit;
  const magie=ed?`<div class="magie">
      <label class="lab">Caractéristique<input data-f="magie.carac" value="${esc(v('carac'))}" placeholder="Sagesse"></label>
      <label class="lab">DD<input data-f="magie.dd" value="${esc(v('dd'))}" inputmode="numeric" placeholder="13"></label>
      <label class="lab">Attaque<input data-f="magie.att" value="${esc(v('att'))}" placeholder="+5"></label></div>`
    :`<div class="magie">${[['DD des sorts',v('dd')],['Attaque',v('att')],['Caractéristique',v('carac')]].map(([l,x])=>`<div class="stat"><b>${esc(x||'–')}</b><span class="lab">${l}</span></div>`).join('')}</div>`;
  let slots='';for(let l=1;l<=9;l++){const t=slotTot(p,l);if(t>0)slots+=`<div class="slot"><span>Niveau ${l}</span>${cases('s:'+l,t)}</div>`}
  const pa=pacte(d);if(pa)slots+=`<div class="slot"><span>Pacte<br><span class="muted">niv ${pa.niv} · repos court</span></span>${cases('s:pacte',pa.n)}</div>`;
  const grat=sortsGratuits(d),vusS=new Set();
  let reglage='';for(let l=1;l<=9;l++)reglage+=`<label>Niv ${l}<input data-f="slotsTot.${l}" data-num inputmode="numeric" value="${slotTot(p,l)||''}" placeholder="0"></label>`;
  const niv={};sortsDe(p).forEach(s=>{const k=cleS(s);if(vusS.has(k))return;vusS.add(k);(niv[num(s.niv)]=niv[num(s.niv)]||[]).push(s)});
  const badges=s=>`${s.C?'<span class="badge" title="Concentration">C</span>':''}${s.R?'<span class="badge" title="Rituel">R</span>':''}${s.M?'<span class="badge" title="Composante matérielle">M</span>':''}`;
  const ligneSort=s=>ed
    ?`<div class="sort-ed"><div class="row"><span class="nom">${esc(s.nom)}${badges(s)}</span>${s.plus!=null?`<button class="${s.C?'on':''}" data-a="sortC" data-p="C" data-i="${s.plus}" aria-pressed="${!!s.C}" title="Concentration">C</button><button class="${s.R?'on':''}" data-a="sortC" data-p="R" data-i="${s.plus}" aria-pressed="${!!s.R}" title="Rituel">R</button><button class="${s.M?'on':''}" data-a="sortC" data-p="M" data-i="${s.plus}" aria-pressed="${!!s.M}" title="Composante matérielle">M</button>`:''}<button class="x" data-a="supprSort" data-k="${esc(cleS(s))}" data-i="${s.plus??''}" aria-label="Retirer ${esc(s.nom)}">✕</button></div>
      ${s.plus!=null?`<div class="row sort-inf"><input data-f="sortsPlus.${s.plus}.inc" value="${esc(s.inc||'')}" placeholder="Incantation (ex. Action)" aria-label="Temps d'incantation"><input data-f="sortsPlus.${s.plus}.portee" value="${esc(s.portee||'')}" placeholder="Portée (ex. 18 m)" aria-label="Portée"></div>`:''}
      <input class="lien-in" data-lien="${esc('sort:'+propre(s.nom))}" value="${esc(lien('sort',s.nom,s.url))}" aria-label="Lien pour ${esc(s.nom)}"></div>`
    :`<div class="sort"><div><a href="${esc(lien('sort',s.nom,s.url))}" target="_blank" rel="noopener">${esc(s.nom)}</a>${badges(s)}${s.niv>0&&grat[norm(s.nom)]?`<span class="grat"><span class="muted">gratuit</span>${cases('g:'+norm(s.nom),grat[norm(s.nom)])}</span>`:''}</div>
      ${s.inc||s.portee||s.note?`<div class="muted">${[s.inc,s.portee,s.note].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div>`;
  const liste=Object.keys(niv).sort((a,b)=>a-b).map(n=>`<section><h2>${n==0?'Sorts mineurs':'Niveau '+n}</h2>`+niv[n].map(ligneSort).join('')+'</section>').join('');
  const ajout=ed?`<section><h2>Ajouter un sort</h2><p class="muted">Écris le nom exact d’AideDD : le lien se fait tout seul.</p>
    <div class="row"><input id="snv" inputmode="numeric" placeholder="Niv" aria-label="Niveau du sort (0 pour un sort mineur)" style="width:3.5rem"><input id="snom" placeholder="Nom du sort" aria-label="Nom du sort" style="flex:1"><button data-a="ajoutSort">Ajouter</button></div></section>`:'';
  return `${magie}
    <section><h2>Emplacements de sort</h2>${slots||(ed?'':'<p class="muted">Aucun emplacement. Règle-les avec Modifier si ton personnage en a.</p>')}
      ${ed?`<div class="lab">Nombre d’emplacements par niveau</div><div class="grid9">${reglage}</div>`:''}</section>
    ${liste||'<p class="muted">Aucun sort.</p>'}${ajout}`;
}

          <button class="x" data-a="supprObj" data-i="${i}" aria-label="Retirer ${esc(o.nom)}">✕</button>
          ${o.nom?`<input class="lien-in" data-lien="${esc('objet:'+propre(o.nom))}" value="${esc(lien('objet',o.nom))}" aria-label="Lien pour ${esc(o.nom)}">`:''}</div>`).join('')
        +`<button data-a="ajoutObj">+ Ajouter un objet</button>`
      :(e.objets.some(o=>o.nom)?`<div class="objets">${e.objets.map((o,i)=>!o.nom?'':`<div class="objet">${itemLien('objet',o.nom)}${o.compte||num(o.qte)!==1?`<span class="qte"><button data-a="qte" data-i="${i}" data-d="-1" aria-label="Retirer un ${esc(o.nom)}">−</button><b>${esc(o.qte)}</b><button data-a="qte" data-i="${i}" data-d="1" aria-label="Ajouter un ${esc(o.nom)}">+</button></span>`:''}</div>`).join('')}</div>`

      :(harmo.length?`<ul class="plain">${harmo.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'<p class="muted">Aucun.</p>')}</section>
    <section><h2>Notes</h2>${ed?`<textarea data-f="notes" rows="8" placeholder="Apparence, histoire, quêtes, PNJ…">${esc(e.notes)}</textarea>`:`<div class="texte">${esc(e.notes)||'<span class="muted">Aucune note. Écris-en avec Modifier.</span>'}</div>`}</section>`;

function ongFiche(p,d,e){
  const hist=[...p.versions].reverse().map(v=>`<li>${new Date(v.date).toLocaleDateString('fr-CH')} : ${esc(v.data.id.classe)} niv ${esc(v.data.id.niveau)}</li>`).join('');
  return `<section><h2 class="h2b"><span>Personnage</span><button class="${conf==='repos'?'on':''}" data-a="repos">${conf==='repos'?'Confirmer ?':'Repos long'}</button></h2>${ui.edit?`<label class="lab">Nom<input data-f="nom" value="${esc(e.nom)}" placeholder="Nom du personnage"></label>`:`<div><b>${esc(e.nom||'Sans nom')}</b></div>`}
      ${ui.edit?itemLien('espece',d.id.espece,'Espèce : '+d.id.espece)+itemLien('historique',d.id.historique,'Historique : '+d.id.historique)
        :`<div>${esc(d.id.classe)}${d.id.sousClasse?' ('+esc(d.id.sousClasse)+')':''} · niveau ${esc(d.id.niveau)}</div><div>Espèce : ${itemLien('espece',d.id.espece)} · Historique : ${itemLien('historique',d.id.historique)}</div><div class="muted">${esc(d.id.alignement)}</div>`}</section>
    <section><h2>Monter de niveau</h2>
      <p class="muted">1. Télécharge le fichier .xml ci-dessous. 2. Ouvre le créateur AideDD, importe ce fichier et monte de niveau. 3. Sur la fiche finale, lance le favori « Export AideDD » et colle le résultat ici. Tes cases cochées, armes, sorts ajoutés et notes sont conservés.</p>
      <button data-a="telXml">Télécharger le .xml</button>
      <textarea id="maj" placeholder="Colle le nouvel export ici">${esc(conf==='maj'?majTexte:'')}</textarea>
      ${conf==='maj'?`<p class="err-t">Cet export ne ressemble pas à ce personnage : ${esc(differences(p,JSON.parse(majTexte)).join(' ; '))}. Mettre à jour quand même ?</p>
        <div class="row"><button class="pri" data-a="majOui">Oui, mettre à jour</button><button data-a="confNon">Annuler</button></div>`
      :`<button class="pri" data-a="maj">Mettre à jour le personnage</button>`}
      ${p.versions.length>1?(conf==='retour'
        ?`<p>Revenir au niveau ${esc(p.versions[p.versions.length-2].data.id.niveau)} (import du ${new Date(p.versions[p.versions.length-2].date).toLocaleDateString('fr-CH')}) ? Les cases et les notes sont gardées.</p>
          <div class="row"><button class="dgr" data-a="retourOui">Oui, revenir</button><button data-a="confNon">Annuler</button></div>`
        :`<button data-a="retour">Revenir à la version précédente</button>`):''}</section>
    ${sortieTexte?`<section><p class="muted">La copie automatique n’a pas marché : sélectionne ce texte et copie-le.</p><textarea readonly id="sortie">${esc(sortieTexte)}</textarea></section>`:''}
    <section><h2>Sauvegarde</h2>
      <p class="muted">Garde une copie de temps en temps (notes, messages). Elle se recolle dans « Importer » sur l’écran d’accueil.</p>
      <div class="row"><button data-a="copierSauv">Copier la sauvegarde</button><button data-a="telSauv">Télécharger</button></div></section>
    <section><h2>Historique des imports</h2><ul class="plain">${hist}</ul></section>
    <section>${confirmSuppr?`<p>Supprimer définitivement ${esc(e.nom||'ce personnage')} ?</p><div class="row"><button class="dgr" data-a="supprOui">Oui, supprimer</button><button data-a="supprNon">Annuler</button></div>`
      :`<button class="dgr" data-a="suppr">Supprimer ce personnage</button>`}</section>`;
}

/* ---------- interactions ---------- */
async function copier(t){
  sortieTexte='';
  try{await navigator.clipboard.writeText(t);flash={t:'Copié.'}}catch(e){sortieTexte=t;flash={err:1,t:'Copie automatique refusée.'}}
  render();
  const s=document.getElementById('sortie');if(s){s.focus();s.select()}
}
function changerOnglet(sens){
  const i=ONGLETS.findIndex(o=>o[0]===ui.onglet),n=ONGLETS.length;
  ui.onglet=ONGLETS[(i+sens+n)%n][0];confirmSuppr=false;conf='';majTexte='';anim=sens>0?'in-g':'in-d';
  save();render();window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,p=P();let haut=false;
  try{switch(a){
    case 'ouvrir':ui.vue='perso';ui.id=b.dataset.id;ui.onglet='combat';ui.edit=false;ui.etats=false;ui.degatsConc=0;confirmSuppr=false;conf='';majTexte='';sortieTexte='';haut=true;break;
    case 'liste':ui.vue='liste';ui.edit=false;ui.etats=false;haut=true;break;
    case 'onglet':{const i=ONGLETS.findIndex(o=>o[0]===ui.onglet),j=ONGLETS.findIndex(o=>o[0]===b.dataset.o);anim=j>i?'in-g':j<i?'in-d':'';ui.onglet=b.dataset.o;confirmSuppr=false;conf='';majTexte='';haut=true;break}
    case 'edit':ui.edit=!ui.edit;break;
    case 'etatsOuvrir':ui.etats=!ui.etats;haut=ui.etats;break;
    case 'etat':p.etat.etats[b.dataset.n]=!p.etat.etats[b.dataset.n];break;
    case 'conc':p.etat.conc=p.etat.conc===b.dataset.n?'':b.dataset.n;if(!p.etat.conc)ui.degatsConc=0;break;
    case 'epuis':p.etat.epuis=Math.min(6,Math.max(0,p.etat.epuis+num(b.dataset.d)));break;
    case 'etatsVider':p.etat.etats={};p.etat.epuis=0;p.etat.conc='';break;
    case 'majApp':{b.textContent='Mise à jour…';b.disabled=true;
      Promise.all(['./','manifest.webmanifest'].map(u=>fetch(u,{cache:'reload'}).catch(()=>{}))).finally(()=>location.reload());return}
    case 'exemple':{const q=creer(JSON.parse(JSON.stringify(EXEMPLE)),'Exemple (Guerrier)');ui.vue='perso';ui.id=q.id;ui.onglet='combat';break}
    case 'importer':flash={t:importer(document.getElementById('imp').value)};break;
    case 'maj':{const t=document.getElementById('maj').value,o=lireTexte(t);if(!estFiche(o))throw new Error("Ce texte ne vient pas du bookmarklet AideDD.");
      if(differences(p,o).length){majTexte=t.trim();armerConf('maj');break}
      flash={t:mettreAJour(p,o)};break}
    case 'majOui':{const o=lireTexte(majTexte);conf='';majTexte='';flash={t:mettreAJour(p,o)};break}
    case 'confNon':conf='';majTexte='';break;
    case 'retour':armerConf('retour');break;
    case 'retourOui':conf='';if(p.versions.length>1)flash={t:revenir(p)};break;
    case 'repos':if(conf==='repos'){conf='';flash={t:reposLong(p)}}else armerConf('repos');break;
    case 'pv':{const c=b.dataset.c,av=num(p.etat[c]);p.etat[c]=Math.max(0,av+num(b.dataset.d));noterDegats(av-num(p.etat[c]));break}
    case 'concOk':ui.degatsConc=0;break;
    case 'cpt':{const k=b.dataset.k,m=num(b.dataset.max);p.etat.used[k]=Math.min(m,Math.max(0,Math.min(p.etat.used[k]||0,m)+num(b.dataset.d)));break}
    case 'case':{const k=b.dataset.k,i=num(b.dataset.i),u=Math.min(p.etat.used[k]||0,num(b.dataset.max));p.etat.used[k]=i<u?i:i+1;break}
    case 'ajoutArme':p.etat.armes.push({nom:'',att:'',deg:'',note:''});break;
    case 'supprArme':p.etat.armes.splice(num(b.dataset.i),1);break;
    case 'qte':{const o=p.etat.objets[num(b.dataset.i)];o.qte=Math.max(0,num(o.qte)+num(b.dataset.d));o.compte=true;break}
    case 'ajoutObj':p.etat.objets.push({nom:'',qte:1});break;
    case 'ajoutSort':{const n=document.getElementById('snom').value.trim().replace(/\s+/g,' '),v=document.getElementById('snv').value.trim();
      if(!n)throw new Error('Indique le nom du sort.');const l=Math.min(9,num(v));
      if(sortsDe(p).some(x=>norm(x.nom)===norm(n)))throw new Error('« '+n+' » est déjà dans la liste.');
      p.etat.sortsPlus.push({niv:l,nom:n.charAt(0).toUpperCase()+n.slice(1),C:false});flash={t:'« '+n+' » ajouté'+(l?' au niveau '+l:' aux sorts mineurs')+'.'};break}
    case 'supprSort':{const i=b.dataset.i;if(i!=='')p.etat.sortsPlus.splice(num(i),1);else if(!p.etat.sortsMoins.includes(b.dataset.k))p.etat.sortsMoins.push(b.dataset.k);break}
    case 'sortC':{const x=p.etat.sortsPlus[num(b.dataset.i)],k=['M','R'].includes(b.dataset.p)?b.dataset.p:'C';x[k]=!x[k];break}
    case 'supprObj':p.etat.objets.splice(num(b.dataset.i),1);break;
    case 'ajoutRes':{const n=document.getElementById('rnom').value.trim(),m=num(document.getElementById('rmax').value);
      if(!n||m<1)throw new Error('Indique un nom et un maximum (au moins 1).');p.etat.ressPerso.push({nom:n,max:Math.min(m,99)});break}
    case 'resOff':{const ov=p.etat.resOv=p.etat.resOv||{};ov[b.dataset.k]={...(ov[b.dataset.k]||{}),off:true};break}
    case 'resOn':{const ov=p.etat.resOv=p.etat.resOv||{};if(ov[b.dataset.k])delete ov[b.dataset.k].off;break}
    case 'capaRes':{const n=b.dataset.n,m=String(n).match(/\((\d+)/);p.etat.ressPerso.push({nom:propre(sansCoche(n)),max:m?Math.min(99,+m[1]):1});flash={t:'« '+propre(sansCoche(n))+' » ajoutée aux ressources.'};break}
    case 'supprRes':p.etat.ressPerso.splice(num(b.dataset.i),1);break;
    case 'copierXml':{const x=xmlPour(p);if(!x)throw new Error("Pas de XML dans cet import. Relance le bookmarklet sur AideDD.");save();copier(x);return}
    case 'telXml':{const x=xmlPour(p);if(!x)throw new Error("Pas de XML dans cet import.");telecharger(x,nomFichier(p,'xml'),'application/xml');flash={t:'Fichier '+nomFichier(p,'xml')+' téléchargé.'};break}
    case 'copierSauv':copier(JSON.stringify({type:'sauvegarde-perso',date:new Date().toISOString(),perso:p}));return;
    case 'telSauv':telecharger(JSON.stringify({type:'sauvegarde-perso',date:new Date().toISOString(),perso:p}),nomFichier(p,'json'),'application/json');flash={t:'Si aucun fichier n’apparaît, utilise « Copier la sauvegarde ».'};break;
    case 'suppr':confirmSuppr=true;break;
    case 'supprNon':confirmSuppr=false;break;
    case 'supprOui':delete db.persos[p.id];db.ordre=db.ordre.filter(x=>x!==p.id);ui.vue='liste';ui.edit=false;confirmSuppr=false;break;
    default:return;
  }}catch(err){flash={err:1,t:err.message}}
  save();render();if(haut)window.scrollTo(0,0);
});
function noterDegats(n){const p=P();if(p&&p.etat.conc&&n>0)ui.degatsConc=(ui.degatsConc||0)+n}
let avantSaisie=null;
document.addEventListener('focusin',ev=>{const f=ev.target.dataset&&ev.target.dataset.f;if(f==='pv'||f==='pvTemp')avantSaisie=num(ev.target.value)});
document.addEventListener('input',ev=>{
  const el=ev.target,p=P();
  if(el.dataset&&el.dataset.ovr&&p){const ov=p.etat.resOv=p.etat.resOv||{},k=el.dataset.ovr;ov[k]={...(ov[k]||{}),max:el.value===''?'':Math.max(0,num(el.value))};save();return}
  if(el.dataset&&el.dataset.lien&&p){const k=el.dataset.lien,v=el.value.trim();if(v&&v!==lienAuto(k.split(':')[0],k.slice(k.indexOf(':')+1),D(p)))p.etat.liens[k]=v;else delete p.etat.liens[k];save();return}
  const f=el.dataset&&el.dataset.f;if(!f||!p)return;
  const path=f.split('.');let o=p.etat;
  for(let i=0;i<path.length-1;i++){o=o[path[i]]=o[path[i]]??{}}
  o[path[path.length-1]]=el.hasAttribute('data-num')?(el.value===''?'':Math.max(0,num(el.value))):el.value;
  save();
});
document.addEventListener('change',ev=>{
  const f=ev.target.dataset&&ev.target.dataset.f;
  if((f==='pv'||f==='pvTemp')&&avantSaisie!=null){noterDegats(avantSaisie-num(ev.target.value));avantSaisie=num(ev.target.value)}
  if((f&&/^objets\.\d+\.nom$/.test(f))||f==='nom'||f==='pv'||f==='pvTemp'||(f&&f.startsWith('slotsTot')))render();
});
/* glisser à gauche / droite pour changer d'onglet (en boucle) */
let tx=null,ty=null;
document.addEventListener('touchstart',ev=>{
  if(ui.vue!=='perso'||ev.touches.length>1||(ev.target.closest&&ev.target.closest('input,textarea'))){tx=null;return}
  tx=ev.touches[0].clientX;ty=ev.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',ev=>{
  if(tx==null)return;const t=ev.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy))changerOnglet(dx<0?1:-1);
},{passive:true});
/* plusieurs fenêtres ouvertes (onglet + icône d'écran d'accueil) : chacune relit ce que l'autre vient d'enregistrer,
   pour ne jamais réécrire une copie périmée par-dessus */
function relire(){
  try{const s=localStorage.getItem(KEY);if(!s||s===JSON.stringify(db))return;db=JSON.parse(s);Object.values(db.persos).forEach(migrer);
    const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;render()}catch(e){}
}
window.addEventListener('storage',ev=>{if(ev.key===KEY)relire()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')relire()});
render();
</script>
